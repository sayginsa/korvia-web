seoBaslik: Korvia | Veri Kaybını Önleme (DLP) · Türkiye'de geliştirildi
seoAciklama: Korvia, Türkiye için geliştirilen yerli Veri Kaybını Önleme (DLP) ürünüdür. Hassas veriyi uç noktada, ağda, bulutta ve yapay zekâ uygulamalarında tanır, sınıflandırır ve kurum dışına çıkmadan durdurur.
eyebrow: Veri Kaybını Önleme | DLP
baslik: Hassas veri, kurumdan çıkmadan durur.
ozet: Yerli geliştirme, yerinde kurulum. Uç nokta, ağ, bulut ve yapay zekâ uygulamaları tek politikada. Korvia hassas veriyi tanır, sınıflandırır ve kurum dışına çıkmadan durdurur.
birincilCta:
  etiket: Demo isteyin
  url: /demo/
ikincilCta:
  etiket: Ürünü inceleyin
  url: /platform/
olay:
  kategori: Müşteri verisi / Yapay zekâ paylaşımı
  cumle: Müşteri listesi bir yapay zekâ aracına yüklenmek istendi.
  dosya: musteri-listesi-2026.xlsx
  icerik: T.C. Kimlik No, IBAN
  hedef: Üretken yapay zekâ servisi · kişisel hesap
  karar: engelle
  kullaniciMesaji: Bu içerik gönderilmedi. Dosyada müşteri kimlik ve hesap bilgisi var. Kurumsal yapay zekâ hesabınızı kullanabilirsiniz.
kanalBaslik: Kullanıcı ne gönderdi, kurumdan ne çıktı?
kanalAciklama: Aynı politika dört farklı kanalda. Hassas değerler maskelenir; işin geri kalanı devam eder.
