ilkeBaslik: Güvenlik kararı verinin bağlamıyla başlar.
ilkeAciklama: Bir dosyanın adı, içindekinin hassas olup olmadığını nadiren söyler. Doğru koruma için içeriği, kullanıcının eylemini, hedefi ve geçerli politikayı birlikte bilmek gerekir.
ilkeler:
- ikon: ''
  baslik: Bilgiyi tanıyın
  metin: İçerik incelemesi, bağlam analizi, parmak izi, birebir veri eşleştirme ve OCR ile hassas veriyi bulun.
- ikon: ''
  baslik: Doğru politikayı uygulayın
  metin: Kritik veri hareketinin izleneceğine, uyarılacağına, kaydedileceğine veya engelleneceğine gerçek zamanlı karar verin.
- ikon: ''
  baslik: Ne olduğunu anlayın
  metin: İmzalı politika olaylarını, eşleşen tespitçileri ve dosyanın tüm zaman çizelgesini tek ekranda inceleyin.
moduller:
- eyebrow: Veri keşfi ve sınıflandırma
  baslik: Neyi koruduğunuzu bilin.
  metin: Hassas iş bilgisini bulun, içeriğini ve bağlamını anlayın, güvenlik ekibinin karar vermesini kolaylaştıran sınıflandırmaları uygulayın.
  maddeler:
  - TEDARİKÇİ-SÖZLEŞMESİ-2026.PDF
  - Sözleşme
  - Fiyat modeli
  - Kişisel veri
  - Gizli
  link:
    etiket: Veri sınıflandırmayı inceleyin
    url: /platform/veri-siniflandirma/
- eyebrow: Veri kaybını önleme
  baslik: Hassas verinin nereye gittiğine siz karar verin.
  metin: USB, yazdırma ve pano gibi uç nokta eylemlerinden e-postaya, web yüklemelerine ve bulut iş akışlarına kadar her kanalda aynı politikayı uygulayın. İhlalleri tam bağlamıyla inceleyin.
  maddeler: []
  link:
    etiket: DLP'yi inceleyin
    url: /platform/dlp/
- eyebrow: Yapay zekâ güvenliği
  baslik: Hassas veri korumasını yapay zekâya taşıyın.
  metin: Komutları ve yanıtları gerçek zamanlı inceleyerek dış dil modellerine, tarayıcıdaki yapay zekâ araçlarına ve kod asistanlarına (Copilot, Cursor, Claude Code gibi) veri sızmasını önleyin.
  maddeler: []
  link:
    etiket: Yapay zekâ güvenliğini inceleyin
    url: /yapay-zeka-guvenligi/
kapiBaslik: Veri tek kapıdan çıkmaz.
kapiMetin: |-
  Gizli bir tablo USB belleğe kopyalanabilir, e-postaya eklenebilir, tarayıcıdan yüklenebilir veya bir yapay zekâ komutuna yapıştırılabilir. Her iş akışının riski farklıdır ama temeldeki soru aynıdır: bu bilgi nedir ve nasıl ele alınmalı?

  Korvia veri bağlamını uç noktada, ağda, bulutta ve yapay zekâda politikaya dayalı korumayla birleştirir.
dagitimBaslik: Esnek kurulum, net veri kontrolü.
dagitimMetin: Yerinde (on-prem), özel bulutunuzda veya yönetilen hizmet olarak çalıştırın. Politikaların, içerik incelemesinin ve olay kayıtlarının nerede işlendiğine siz karar verirsiniz. Yönetilen güvenlik hizmeti (MSSP) iş ortakları da Korvia'yı hizmet olarak sunabilir.
dagitimSecenekleri:
- ikon: ''
  baslik: Yerinde (on-prem)
  metin: Tüm bileşenler ağınızda. İnternetten yalıtılmış ağlarda da çalışır.
- ikon: ''
  baslik: Özel bulut
  metin: Kendi bulut kiracılığınızda, verinin yerini siz seçersiniz.
- ikon: ''
  baslik: Yönetilen hizmet
  metin: Platformu biz veya iş ortağınız işletir; ajanlar sizde kalır.
pocNot: Kanıt bir sunum değil, kendi verinizle yapılan bir testtir.
