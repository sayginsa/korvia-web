kimlik: Kamu
yol: sektorler/kamu
bolum: sektorler
sira: 4
ikon: kamu
menuAciklama: Bakanlıklar, belediyeler ve kamu kurumları.
seoBaslik: Kamu kurumları için DLP | Korvia
seoAciklama: 'Kamu kurumları çoğu zaman yurt dışında barındırılan servisleri kullanamaz. Korvia kendi altyapınızda, internet bağlantısı olsun olmasın çalışır.'
eyebrow: Sektörler · Kamu
baslik: Vatandaş verisi, sizin altyapınızda.
ozet: Kamu kurumları kimlik belgeleri, vergi ve sosyal güvenlik kayıtlarıyla çalışır ve çoğu zaman yurt dışında barındırılan servisleri kullanamaz. Korvia kendi altyapınızda, internet bağlantısı olsun olmasın çalışır.
cta:
  etiket: Demo isteyin
  url: /demo/
bloklar:
- discriminant: senaryo
  value:
    baslik: Bir T.C. kimlik numarası listesi kişisel bulut sürücüye gidiyor.
    veri: Vatandaş T.C. kimlik numarası listesi
    kullanici: Dosya sorumlusu
    hedef: Kişisel bulut sürücü
    politika: 'Vatandaş verisi: yalnızca kurum içi sistemler'
    karar: engelle
    kararNotu: durduruldu, nedeni gösterildi
- discriminant: metin
  value:
    eyebrow: ''
    baslik: Kamu hizmetlerinde hassas bilgiyi koruyun.
    govde: |-
      Bakanlıklar, belediyeler ve kamu kurumları T.C. kimlik numaralarını, vergi beyannamelerini, sosyal yardım kayıtlarını ve ihale belgelerini sıkı veri egemenliği şartlarıyla işler. Üst veriyi veya içeriği yurt dışına yönlendiren yalnızca bulut tabanlı güvenlik araçları çoğu zaman söz konusu bile olamaz.

      Korvia tamamen kurum içinde veya internetten yalıtılmış ağlarda kurulur. Sağlama doğrulamalı T.C. kimlik tespitini, otomatik sınıflandırmayı ve imzalı denetim izlerini KVKK ve Bilgi ve İletişim Güvenliği Rehberi çalışmalarınız için bir araya getirir.
- discriminant: kartlar
  value:
    eyebrow: ''
    baslik: Korvia'nın hangi parçaları bunu yapar?
    aciklama: ''
    ogeler:
    - ikon: sunucu
      baslik: Kurulum
      metin: Kendi altyapınızda bir cihaz; gerektiğinde yalıtılmış ağda.
    - ikon: tara
      baslik: Veri Keşfi ve DSPM
      metin: Kişisel veri mevzuatının istediği kişisel veri envanteri.
    - ikon: parmakIzi
      baslik: Tespit Motoru
      metin: T.C. kimlik ve vergi numaraları yalnızca biçimle değil sağlama doğrulamasıyla kontrol edilir.
- discriminant: not
  value:
    baslik: Hangi kurulum uygun?
    metin: Yerinde (on-prem). Siz açmadıkça ağınızdan hiçbir şey çıkmaz.
    link:
      etiket: Kurulum seçenekleri
      url: /platform/kurulum/
- discriminant: mevzuat
  value:
    baslik: Hangi mevzuata dokunur?
    ogeler:
    - ikon: ''
      baslik: KVKK
      metin: '6698 sayılı Kanun: veri güvenliğine ilişkin yükümlülükler (md. 12), veri envanteri ve ihlal bildirimi.'
    - ikon: ''
      baslik: Bilgi ve İletişim Güvenliği Rehberi
      metin: 'Cumhurbaşkanlığı rehberi: kritik verinin sınıflandırılması, korunması ve kayıt yönetimi.'
- discriminant: sss
  value:
    baslik: Kamu kurumlarından gelen sorular
    ogeler:
    - soru: Korvia internetten yalıtılmış ağda çalışır mı?
      cevap: Evet. Korvia tamamen kurum içinde veya internetten yalıtılmış ağlarda kurulur. Güncellemeler imzalı çevrim dışı paketler olarak gelir; varsayılan olarak telemetri yoktur ve siz açmadıkça ağınızdan hiçbir şey çıkmaz.
    - soru: Korvia Bilgi ve İletişim Güvenliği Rehberi çalışmalarına nasıl katkı sağlar?
      cevap: Sağlama doğrulamalı T.C. kimlik tespitini, otomatik sınıflandırmayı ve imzalı denetim izlerini bir araya getirir. Rehberdeki tedbirlerin nasıl karşılandığına dair değerlendirme kurumunuza ve denetçinize aittir.
    - soru: Korvia nerede geliştiriliyor?
      cevap: Türkiye'de. Satış, kurulum ve destek de Türkiye'dedir; destek Türkçedir.
- discriminant: ilgili
  value:
    baslik: İlgili sayfalar
    sayfalar:
    - mevzuat
    - kvkk-12-madde-ve-dlp
    - kurulum
