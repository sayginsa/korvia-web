- discriminant: kartlar
  value:
    eyebrow: ''
    baslik: Nasıl düşünüyoruz?
    aciklama: ''
    ogeler:
    - ikon: ''
      baslik: Her veri eşit değildir
      metin: Aynı dosya, onu kimin nereye taşıdığına göre farklı risk taşır.
    - ikon: ''
      baslik: Etiketler karara dönüşmeli
      metin: '"Gizli" damgası, bir politika ona göre davranmadıkça hiçbir şeyi korumaz.'
    - ikon: ''
      baslik: Alarm değil, bağlam
      metin: Analist ne olduğunu, kimin yaptığını, hangi verinin nereye gittiğini ve nedenini görür.
    - ikon: ''
      baslik: Kendi verimiz konusunda açığız
      metin: Neyi incelediğimizi, neyi sakladığımızı ve nerede tuttuğumuzu söyleriz.
- discriminant: tablo
  value:
    baslik: Kimin için?
    aciklama: ''
    sutunlar:
    - ''
    - ''
    satirlar:
    - hucreler:
      - Ne yapıyoruz
      - Kurumun hassas verisini bulur, sınıflandırır, sızmadan durdururuz.
    - hucreler:
      - Kime
      - Türkiye'deki kamu kurumları, bankalar, sigorta, sağlık, savunma ve büyük işletmeler.
    - hucreler:
      - Muhatap
      - CISO, BT güvenlik ve KVKK uyum ekipleri.
    - hucreler:
      - Neden Korvia
      - Yerli geliştirme, yerinde kurulum. TCKN, IBAN, vergi numarası gibi Türkçe veri tipleri hazır gelir. Destek Türkiye'de.
- discriminant: metin
  value:
    eyebrow: ''
    baslik: Kim geliştiriyor?
    govde: |-
      Korvia Türkiye'de geliştirilir ve yerinde (on-prem) kurulur; veri yurt dışına çıkmaz. T.C. kimlik, IBAN ve vergi numarası gibi Türkçe veri tipleri hazır gelir. Satış, kurulum ve destek Türkiye'dedir.

      Ürünü, yirmi yılı aşkın süredir kurumlarda veri güvenliği projeleri yürüten bir ekip geliştiriyor. Hantal ajanlardan, yapay zekâ etrafındaki kör noktalardan ve bağlamı olmayan alarmlardan yorulan güvenlik ekipleri için tek hafif ajan, varsayılan olarak yerinde kurulum ve sınıflandırma etiketlerini gerçekten uygulayan politikalar sunar.
