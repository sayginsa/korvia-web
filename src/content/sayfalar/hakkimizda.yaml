- discriminant: metin
  value:
    eyebrow: ''
    baslik: Kim geliştiriyor?
    govde: |-
      Korvia, yirmi yılı aşkın süredir kurumlarda veri güvenliği projeleri yürüten bir ekip tarafından Türkiye pazarı için hazırlandı. Hantal ajanlardan, yapay zekâ etrafındaki kör noktalardan ve bağlamı olmayan alarmlardan yorulan güvenlik ekipleri için tek hafif ajan, varsayılan olarak kurum içi veri egemenliği ve sınıflandırma etiketlerini gerçekten uygulayan politikalar sunar.

      Türkiye'de satış, kurulum ve destek iş ortağı kanalıyla verilir.
